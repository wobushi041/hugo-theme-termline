weight = 2

[[languages.zh-cn.menu.main]]
identifier = "tags"
name = "标签"
url = "/tags"
weight = 3

[[languages.zh-cn.menu.main]]
identifier = "journeys"
name = "足迹"
url = "/journeys"
weight = 4

[[languages.zh-cn.menu.main]]
identifier = "about"
name = "关于"
url = "/about"
weight = 5

[languages.en]
label = "English"
weight = 2

[languages.en.params]
subtitle = "A minimal terminal theme for Hugo"
