<div class="site-search hidden" data-search-modal aria-hidden="true">
  <div class="site-search__backdrop" data-search-close></div>

  <div
    class="site-search__panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="site-search-title"
  >
    <div class="site-search__header">
      <div class="site-search__input" data-search-input-wrap>
        <span class="site-search__input-icon" aria-hidden="true">
          {{ partial "icons/search.html" . }}
        </span>
        <input
          id="site-search-title"
          class="site-search__field"
          type="text"
          placeholder="输入关键词搜索"
          autocomplete="off"
          spellcheck="false"
          data-search-input
        />
      </div>
    </div>

    <div class="site-search__results" data-search-results>
      <div class="site-search__empty" data-search-empty>输入关键词开始搜索</div>
    </div>

    <div class="site-search__footer">
      <button class="site-search__action" type="button" data-search-confirm>确认</button>
      <button
        class="site-search__action site-search__action--ghost"
        type="button"
        data-search-close
      >
        关闭
      </button>
    </div>
  </div>
</div>
